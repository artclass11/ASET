[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aset-research-engine"
version = "0.4.0"
description = "Open multi-provider public-equity research, automatic dataset routing, screening and quantitative analytics engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Amor Research Tools"}]
keywords = ["equity research", "quantitative finance", "market data", "analytics", "dataset routing", "backtesting"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.20",
  "jinja2>=3.1",
]

[project.scripts]
stock-research = "stock_analyzer:cli"
aset-mcp = "stock_analyzer.mcp_server:main"
aset-dataset = "stock_analyzer.dataset_cli:main"

[tool.setuptools.packages.find]
include = ["stock_analyzer*"]

[project.optional-dependencies]
analytics = [
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=18.0",
  "openpyxl>=3.1",
]
universe = [
  "financedatabase==2.4.0",
]
prices = [
  "pandas>=2.2",
  "numpy>=2.0",
  "yfinance==1.7.0",
]
china = [
  "pandas>=2.2",
  "numpy>=2.0",
  "akshare==1.19.1",
]
sec = [
  "edgartools==5.58.0",
  "sec-edgar-downloader==5.1.0",
]
macro = [
  "pandas>=2.2",
  "pandas-datareader==0.11.1",
]
openbb = [
  "openbb==5.0.0",
]
openbb-us-market = [
  "openbb==5.0.0",
  "openbb-nasdaq==1.6.3",
]
openbb-us-sec = [
  "openbb==5.0.0",
  "openbb-sec==1.6.2",
]
openbb-macro = [
  "openbb==5.0.0",
  "openbb-fred==2.0.0",
]
openbb-canada = [
  "openbb==5.0.0",
  "openbb-tmx==2.0.0",
]
openbb-data = [
  "openbb==5.0.0",
  "openbb-fred==2.0.0",
  "openbb-tmx==2.0.0",
]
quant-vectorized = [
  "vectorbt==1.1.1",
]
quant-event = [
  "backtrader",
]
connectors = [
  "mcp>=2.0,<3",
]
yfinance-mcp = [
  "mcp>=2.0,<3",
  "pandas>=2.2",
  "numpy>=2.0",
  "yfinance==1.7.0",
]
data = [
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=18.0",
  "financedatabase==2.4.0",
  "yfinance==1.7.0",
  "akshare==1.19.1",
  "pandas-datareader==0.11.1",
  "edgartools==5.58.0",
  "sec-edgar-downloader==5.1.0",
]
all = [
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=18.0",
  "openpyxl>=3.1",
  "financedatabase==2.4.0",
  "yfinance==1.7.0",
  "akshare==1.19.1",
  "pandas-datareader==0.11.1",
  "edgartools==5.58.0",
  "sec-edgar-downloader==5.1.0",
  "openbb==5.0.0",
  "mcp>=2.0,<3",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "bandit>=1.7",
  "mcp>=2.0,<3",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["__pycache__", "main.py", "astra_model_setup.py", "codex_harness.py", "huggingface_integration.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = "(main|astra_model_setup|codex_harness|huggingface_integration)\\.py$"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "products/signaldesk"]
