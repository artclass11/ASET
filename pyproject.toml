[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aset-research-engine"
version = "0.3.0"
description = "Open multi-provider public-equity research and quantitative analytics engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Amor Research Tools"}]
keywords = ["equity research", "quantitative finance", "market data", "analytics", "backtesting"]
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=18.0",
  "openpyxl>=3.1",
  "yfinance==1.7.0",
  "financedatabase==2.4.0",
  "akshare==1.18.95",
  "pandas-datareader==0.11.1",
  "edgartools==5.58.0",
  "sec-edgar-downloader==5.1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.20",
  "jinja2>=3.1",
]

[project.scripts]
stock-research = "stock_analyzer:cli"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "bandit>=1.7",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["__pycache__", "main.py", "astra_model_setup.py", "codex_harness.py", "huggingface_integration.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = "(main|astra_model_setup|codex_harness|huggingface_integration)\\.py$"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "products/signaldesk"]
