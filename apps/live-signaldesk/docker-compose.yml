services:
  signaldesk:
    build: .
    container_name: aset-signaldesk
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp:
    build:
      context: .
      dockerfile: mcp.Dockerfile
    container_name: aset-signaldesk-mcp
    restart: unless-stopped
    environment:
      SIGNALDESK_API_BASE: http://signaldesk:8000
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8100
      MCP_PATH: /mcp
    ports:
      - "8100:8100"
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      signaldesk:
        condition: service_healthy
