[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aset-research-engine"
version = "0.3.0"
description = "Open multi-provider public-equity research and quantitative analytics engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Amor Research Tools"}]
keywords = ["equity research", "quantitative finance", "market data", "analytics", "backtesting"]
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=18.0",
  "openpyxl>=3.1",
  "yfinance==1.7.0",
  "financedatabase==2.4.0",
  "akshare==1.18.95",
  "pandas-datareader==0.11.1",
  "edgartools==5.58.0",
  "sec-edgar-downloader==5.1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.20",
  "jinja2>=3.1",
]

[project.scripts]
stock-research = "stock_analyzer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests", "../products/signaldesk"]

[tool.ruff]
line-length = 100
target-version = "py311"