[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-stock-research-engine"
version = "0.2.0"
description = "Bulk multi-provider public equity research engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Amor Research Tools"}]
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=18.0",
  "openpyxl>=3.1",
  "yfinance==1.7.0",
  "financedatabase==2.4.0",
  "akshare==1.18.95",
  "pandas-datareader==0.11.1",
  "edgartools==5.58.0",
  "sec-edgar-downloader==5.1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.20",
  "jinja2>=3.1",
]

[project.scripts]
stock-research = "stock_analyzer:cli"
