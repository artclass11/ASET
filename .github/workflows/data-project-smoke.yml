name: ASET Optional Data Project Smoke Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  provider-imports:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: universe
            package: financedatabase
            import: financedatabase
          - extra: prices
            package: yfinance
            import: yfinance
          - extra: china
            package: akshare
            import: akshare
          - extra: sec
            package: edgartools
            import: edgar
          - extra: macro
            package: pandas-datareader
            import: pandas_datareader
          - extra: openbb
            package: openbb
            import: openbb
          - extra: quant-vectorized
            package: vectorbt
            import: vectorbt
          - extra: quant-event
            package: backtrader
            import: backtrader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install selected optional project
        run: python -m pip install -e ".[$\{{ matrix.extra }}]"
      - name: Import and version smoke test
        env:
          PACKAGE: $\{{ matrix.package }}
          IMPORT_MODULE: $\{{ matrix.import }}
        run: |
          python - <<'PY'
          import importlib
          import importlib.metadata
          import os

          module = importlib.import_module(os.environ["IMPORT_MODULE"])
          version = importlib.metadata.version(os.environ["PACKAGE"])
          assert version
          print(f"{os.environ['PACKAGE']} {version} imported successfully")
          print(f"module={module.__name__}")
          PY

  router-contract:
    runs-on: ubuntu-latest
    needs: provider-imports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run router tests
        run: python -m pytest -q tests/test_data_router.py tests/test_mcp_server.py
