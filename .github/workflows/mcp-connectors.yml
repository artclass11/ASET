name: MCP Connector Validation

on:
  push:
    branches:
      - feat/windows-signaldesk
      - main
    paths:
      - "apps/live-signaldesk/mcp_server.py"
      - "apps/live-signaldesk/agent_engine.py"
      - "apps/live-signaldesk/research_agent.py"
      - "apps/live-signaldesk/test_agent_engine.py"
      - "apps/live-signaldesk/requirements-mcp.txt"
      - "integrations/**"
      - "agents/**"
      - ".github/workflows/mcp-connectors.yml"
  pull_request:
    paths:
      - "apps/live-signaldesk/mcp_server.py"
      - "apps/live-signaldesk/agent_engine.py"
      - "apps/live-signaldesk/test_agent_engine.py"
      - "apps/live-signaldesk/requirements-mcp.txt"
      - "integrations/**"
      - "agents/**"
      - ".github/workflows/mcp-connectors.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP runtime
        run: pip install -r apps/live-signaldesk/requirements-mcp.txt
      - name: Compile
        run: python -m compileall apps/live-signaldesk/mcp_server.py apps/live-signaldesk/agent_engine.py apps/live-signaldesk/research_agent.py integrations/claude-mcpb/server/main.py
      - name: Import
        working-directory: apps/live-signaldesk
        run: python -c "import mcp_server; print(mcp_server.SERVER_NAME)"
      - name: Unit tests
        working-directory: apps/live-signaldesk
        run: python -m unittest -v test_agent_engine.py
      - name: Manifest smoke test
        run: |
          grep -q 'transport: MCP' agents/multibagger/manifest.yaml
          grep -q 'screen_universe' agents/multibagger/manifest.yaml
          grep -q '  - chatgpt' agents/multibagger/manifest.yaml
          grep -q '  - claude' agents/multibagger/manifest.yaml
          grep -q '  - manus' agents/multibagger/manifest.yaml
          echo "Agent manifest smoke test passed"
