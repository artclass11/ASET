name: ASET Core CI

on:
  push:
    paths:
      - "stock_analyzer/**"
      - "tests/**"
      - "agents/research-director/**"
      - "apps/live-signaldesk/agent_engine.py"
      - "apps/live-signaldesk/mcp_server.py"
      - "agents/research-director/**"
      - "apps/live-signaldesk/agent_engine.py"
      - "apps/live-signaldesk/mcp_server.py"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "stock_analyzer/**"
      - "tests/**"
      - "agents/research-director/**"
      - "apps/live-signaldesk/agent_engine.py"
      - "apps/live-signaldesk/mcp_server.py"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and quality tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall stock_analyzer tests agents/research-director apps/live-signaldesk/agent_engine.py
      - name: Tests
        run: python -m pytest -q tests
      - name: Lint
        run: ruff check stock_analyzer tests agents/research-director apps/live-signaldesk/agent_engine.py
      - name: Format check
        run: ruff format --check stock_analyzer tests agents/research-director apps/live-signaldesk/agent_engine.py
      - name: Type check
        run: mypy stock_analyzer tests
      - name: Security scan
        run: bandit -q -r stock_analyzer
      - name: Dependency audit
        run: pip-audit --skip-editable
