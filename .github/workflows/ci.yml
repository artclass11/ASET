name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tooling
        run: python -m pip install --upgrade pip && pip install pytest ruff mypy pip-audit
      - name: Compile
        run: python -m compileall .
      - name: Tests
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy .
      - name: Dependency audit
        run: pip-audit
