name: ASET Core CI

on:
  push:
    paths:
      - "stock_analyzer/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "stock_analyzer/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx pydantic pytest pytest-asyncio ruff
      - name: Compile
        run: python -m compileall stock_analyzer tests
      - name: Tests
        run: python -m pytest -q tests
      - name: Lint
        run: ruff check stock_analyzer tests
