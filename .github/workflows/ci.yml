name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tooling and package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Compile maintained Python code
        run: python -m compileall stock_analyzer products tests
      - name: Tests
        run: pytest -q
      - name: Lint
        run: ruff check stock_analyzer products tests
      - name: Format check
        run: ruff format --check stock_analyzer products tests
      - name: Type check
        run: mypy stock_analyzer products tests
      - name: Security scan
        run: bandit -q -r stock_analyzer products/signaldesk/signaldesk.py
      - name: Dependency audit
        run: pip-audit --skip-editable
