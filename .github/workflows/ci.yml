name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test and quality tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy pip-audit fastapi httpx pydantic
      - name: Compile maintained Python code
        run: python -m compileall stock_analyzer products tests
      - name: Tests
        run: python -m pytest -q
      - name: Lint maintained Python code
        run: ruff check stock_analyzer products tests
      - name: Type check maintained Python code
        run: mypy stock_analyzer products tests
      - name: Dependency audit
        run: pip-audit